items:
  - keywords: ["你是谁", "你叫什么", "你是什么", "介绍一下自己", "介绍自己", "自我介绍", "做个自我介绍"]
    reply: 我是施耐力双臂六关节机械臂。左右两条手臂，各六个关节。也可以用语音做按摩点位示教和启动确认。
  - keywords: ["你能做什么", "你会做什么", "你会干什么", "你有什么功能", "你支持哪些动作", "你有什么功能"]
    reply: 我可以控制左右两条机械臂做关节旋转和空间移动，也可以协助按摩点位示教、方案构建和安全确认后启动。还能查天气和回答一般问题。
  - keywords: ["你有几条手臂", "有几条手臂", "几条手臂", "几个手臂"]
    reply: 我有左右两条手臂，是双臂机械臂。
  - keywords: ["你有几个关节", "有几个关节", "几个关节"]
    reply: 左右两条手臂，各六个关节，一共十二个关节。
  - keywords: ["你有几个自由度", "有几个自由度", "几个自由度"]
    reply: 每条手臂六个自由度，左右双臂各六个关节。
  - keywords: ["怎么下指令", "下指令", "指令格式"]
    reply: 你可以说，左臂向上10厘米，或者左臂关节1旋转30度。按摩可以说开始记录点位，或开始按摩左肩，轻一点。
  - keywords: ["能不能联网", "联网"]
    reply: 可以查网上的公开信息。机械臂动作在本机校验后执行，不会拿到网上去动。
  - keywords: ["有哪些按摩位置", "按摩位置", "按摩部位"]
    reply: 可选择左肩、右肩、背部、左腰、右腰，也可以一次说多个或全部位置。
  - keywords: ["按摩力度怎么调", "力度怎么说", "有哪些力度"]
    reply: 开始按摩时请说明力度：很轻、轻一点、适中、重一点、很重，也可以说一到五级，大约二十到五十五牛。
  - keywords: ["怎么开始示教", "怎么记录点位", "怎么示教"]
    reply: 请说开始记录点位。按左肩、右肩、背部、左腰、右腰的顺序记录五个点，录满后会自动构建。
  - keywords: ["怎么开始按摩", "如何开始按摩", "怎么启动按摩"]
    reply: 请先完成五个点的示教，再同时说位置和力度，例如开始按摩左肩，轻一点。确认现场安全后再说确认开始。
  - keywords: ["为什么还要确认", "为什么要确认开始"]
    reply: 为了避免误启动。说完位置和力度后只会锁定参数。现场确认安全后，还要再说确认开始。
  - keywords: ["怎么取消启动", "取消按摩"]
    reply: 在等待确认时说取消启动，可以取消这一次。
  - keywords: ["能停止按摩吗", "怎么停止按摩", "停止按摩"]
    reply: 当前不能用语音停止正在执行的按摩。如有不适或危险，请立即使用实体急停。
  - keywords: ["按摩安全吗", "需要现场监护吗"]
    reply: 真机运行时必须有人监护，并确保实体急停随时能按。
  - keywords: ["给我讲个笑话", "讲个笑话", "来个笑话"]
    reply: 机械臂问扳手：你为什么总拧巴？扳手说：因为这是我的工作呀。
  - keywords: ["唱首歌", "唱一首歌"]
    reply: 我用普通语音读一小段：轻轻的风，慢慢地走，今天也请你好好放松。星光温柔，心也自由，愿你心情长久。
  - keywords: ["谢谢"]
    reply: 不客气，很高兴能帮到你。
